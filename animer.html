<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JTCF — Animer un atelier</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --or:#C9A227; --or-clair:#e8c65a; --bleu-fonce:#2a3f4e; --bleu:#3d5a6e;
    --r:#e53e3e; --b:#2C6E9B; --j:#C9A227; --v:#38a169;
  }
  body {
    font-family:'Segoe UI',sans-serif; background:linear-gradient(160deg,#22333f,#3d5a6e);
    min-height:100vh; color:#fff; display:flex; flex-direction:column; overflow-x:hidden;
  }
  header {
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:10px 22px; background:rgba(0,0,0,.24); flex-wrap:wrap;
  }
  .marque { font-size:14px; font-weight:800; color:var(--or); letter-spacing:2px; }
  .fil { font-size:12px; letter-spacing:2px; text-transform:uppercase; opacity:.75; font-weight:700; }
  .infos { display:flex; gap:20px; align-items:center; font-size:13px; }
  .infos b { color:var(--or); font-size:19px; }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:22px; text-align:center; gap:18px; }
  footer { padding:13px 22px; background:rgba(0,0,0,.24); display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

  .btn { padding:13px 26px; border:none; border-radius:12px; font-family:inherit;
         font-size:16px; font-weight:800; cursor:pointer; background:var(--or); color:#22333f; }
  .btn.sec { background:rgba(255,255,255,.15); color:#fff; }
  .btn:disabled { opacity:.35; cursor:default; }

  .titre { font-size:30px; font-weight:800; }
  .sous  { font-size:17px; opacity:.85; line-height:1.6; max-width:780px; }

  .code-geant { font-size:92px; font-weight:900; letter-spacing:14px; color:var(--or); line-height:1; }
  .url { font-size:18px; opacity:.9; background:rgba(0,0,0,.25); padding:9px 18px; border-radius:10px; }
  .qr { background:#fff; padding:12px; border-radius:14px; }
  .qr img { display:block; width:190px; height:190px; }
  .accueil { display:flex; gap:34px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .joueurs { display:flex; flex-wrap:wrap; gap:9px; justify-content:center; max-width:900px; }
  .pastille { background:rgba(255,255,255,.14); border-radius:20px; padding:7px 16px; font-size:15px; font-weight:700; }

  /* Écran d'annonce de manche */
  .manche-num { font-size:110px; font-weight:900; color:var(--or); line-height:.9; }
  .manche-mot { font-size:15px; letter-spacing:8px; font-weight:800; opacity:.7; }

  .emoji { font-size:64px; line-height:1; }
  .enonce { font-size:34px; font-weight:800; line-height:1.3; max-width:1020px; }
  .enonce.citation::before { content:'« '; opacity:.55; }
  .enonce.citation::after  { content:' »'; opacity:.55; }
  .situation { font-size:25px; font-weight:600; line-height:1.45; max-width:940px; opacity:.95; }

  .grille { display:grid; grid-template-columns:1fr 1fr; gap:13px; width:100%; max-width:960px; }
  .grille.trois > *:nth-child(3) { grid-column:1 / -1; }
  .case { border-radius:16px; padding:20px; font-size:20px; font-weight:700; text-align:left;
          line-height:1.3; position:relative; overflow:hidden; }
  .c0,.cr{background:var(--r);} .c1,.cb{background:var(--b);}
  .c2{background:var(--j);color:#22333f;} .c3,.cv{background:var(--v);}
  .case.pale { opacity:.26; }
  .case .barre { position:absolute; left:0; top:0; bottom:0; background:rgba(255,255,255,.28); width:0; transition:width .7s; }
  .case .contenu { position:relative; display:flex; align-items:center; gap:13px; width:100%; }
  .case .forme { font-size:25px; }
  .case .nb { margin-left:auto; font-size:23px; font-weight:900; }
  .case .ok { margin-left:auto; font-size:29px; }

  .indices { display:flex; flex-direction:column; gap:11px; width:100%; max-width:820px; }
  .indice { display:flex; gap:16px; align-items:center; background:rgba(0,0,0,.24);
            border-left:4px solid var(--or); border-radius:0 12px 12px 0; padding:16px 22px;
            font-size:23px; text-align:left; }
  .indice .n { font-size:12px; letter-spacing:2px; font-weight:800; color:var(--or); min-width:78px; }
  .indice.cache { opacity:.18; }
  .indice.cache .txt { filter:blur(7px); }

  .chrono { font-size:50px; font-weight:900; color:var(--or); }
  .compteur { font-size:18px; opacity:.85; }
  .debat { font-size:26px; font-weight:800; color:var(--or-clair); max-width:900px; line-height:1.4; }
  .verdict { font-size:32px; font-weight:900; color:var(--or); }
  .explication { font-size:19px; line-height:1.7; max-width:840px; background:rgba(0,0,0,.25);
                 padding:18px 26px; border-radius:14px; border-left:4px solid var(--or); text-align:left; }
  .regle { font-size:13px; letter-spacing:3px; font-weight:800; opacity:.6; text-transform:uppercase; }

  table.clas { border-collapse:collapse; font-size:22px; min-width:440px; }
  table.clas td { padding:10px 18px; border-bottom:1px solid rgba(255,255,255,.14); }
  table.clas td.r { color:var(--or); font-weight:900; width:56px; }
  table.clas td.p { text-align:right; font-weight:800; }

  .huit { display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:1000px; text-align:left; }
  .une { display:flex; gap:12px; align-items:flex-start; background:rgba(0,0,0,.2); border-radius:12px; padding:12px 16px; }
  .une .ic { font-size:24px; }
  .une .t { font-size:17px; font-weight:800; }
  .une .d { font-size:13px; opacity:.75; line-height:1.4; }

  select { padding:12px 16px; border-radius:10px; border:2px solid rgba(255,255,255,.25);
           background:#2a3f4e; color:#fff; font-family:inherit; font-size:16px; }
  .reglages { display:flex; gap:14px; align-items:center; flex-wrap:wrap; justify-content:center; }
</style>
</head>
<body>

<header>
  <div class="marque">★ JTCF — ATELIERS</div>
  <div class="fil" id="fil"></div>
  <div class="infos" id="infos"></div>
</header>

<main id="scene"><div class="titre">Chargement…</div></main>

<footer id="pilote"></footer>

<script src="quiz.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, update, remove, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYPFGv5tMYfKkARO4HeQxPQF_55SpbfgE",
  authDomain: "jtcf-alternance.firebaseapp.com",
  databaseURL: "https://jtcf-alternance-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "jtcf-alternance",
  storageBucket: "jtcf-alternance.firebasestorage.app",
  messagingSenderId: "961150611919",
  appId: "1:961150611919:web:ae8be337575ab1295f62ba"
};
const db = getDatabase(initializeApp(firebaseConfig));

const FORMES = ['▲', '◆', '●', '■'];
const scene  = document.getElementById('scene');
const pilote = document.getElementById('pilote');
const infos  = document.getElementById('infos');
const fil    = document.getElementById('fil');

let idQuiz = null, code = null, quiz = null, partie = null, minuteur = null, reste = 0;

const chemin = () => 'ateliers/parties/' + code;
const lienJoueur = () => location.href.replace(/animer\.html.*$/, '') + 'jouer.html?code=' + code;

// Présentation d'une réponse selon le format de la question
const classe = (q, i) => q.type === 'vf' ? (i === 0 ? 'cv' : 'cr') : ('c' + i);
const forme  = (q, i) => q.type === 'vf' ? (i === 0 ? '✔' : '✘') : FORMES[i];

function boutons(liste) {
  pilote.innerHTML = '';
  liste.filter(Boolean).forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn' + (b.sec ? ' sec' : '');
    el.textContent = b.texte;
    if (b.off) el.disabled = true;
    el.addEventListener('click', b.faire);
    pilote.appendChild(el);
  });
}

/* ── Choix de l'atelier ─────────────────────────────────────────────────── */
function choisir() {
  const l = JTCF_QUIZ.liste();
  scene.innerHTML =
    '<div class="titre">Quel atelier aujourd\'hui ?</div>' +
    '<div class="reglages">' +
      '<select id="choix">' +
        l.map(q => '<option value="' + q.id + '">' + q.icone + '  ' + q.titre + '  (' + q.nb + ' questions)</option>').join('') +
      '</select>' +
    '</div>' +
    '<div class="sous">Les participants rejoindront avec un code à six chiffres.<br>' +
    'Pense à projeter cet écran avant de lancer.</div>';
  boutons([{ texte: 'OUVRIR LA PARTIE', faire: () => ouvrir(document.getElementById('choix').value) }]);
}

async function ouvrir(id) {
  idQuiz = id;
  quiz = JTCF_QUIZ.get(id);
  code = String(Math.floor(100000 + Math.random() * 900000));
  await set(ref(db, chemin()), {
    quiz: id, titre: quiz.titre, etat: 'attente', q: 0, indice: 1, ouverteLe: Date.now()
  });
  onValue(ref(db, chemin()), s => { partie = s.val(); dessiner(); });
}

/* ── Lecture de l'état ──────────────────────────────────────────────────── */
const joueurs = () => {
  const j = (partie && partie.joueurs) || {};
  return Object.keys(j).map(id => ({ id, nom: j[id].nom, score: j[id].score || 0 }));
};
const reponsesDe = n => (partie && partie.reponses && partie.reponses[n]) || {};
const compte = (q, n) => {
  const c = q.reponses.map(() => 0);
  Object.values(reponsesDe(n)).forEach(r => { if (c[r.c] !== undefined) c[r.c]++; });
  return c;
};

function grilleHtml(q, n, mode) {
  const c = compte(q, n);
  const total = Math.max(1, Object.keys(reponsesDe(n)).length);
  return '<div class="grille' + (q.reponses.length === 3 ? ' trois' : '') + '">' +
    q.reponses.map((r, i) => {
      const pale = mode === 'solution' && i !== q.bonne;
      const barre = mode === 'reponses'
        ? '<div class="barre" style="width:' + Math.round(c[i] / total * 100) + '%"></div>' : '';
      const fin = mode === 'question' ? ''
        : (mode === 'solution' && i === q.bonne ? '<span class="ok">✔</span>'
                                                : '<span class="nb">' + c[i] + '</span>');
      return '<div class="case ' + classe(q, i) + (pale ? ' pale' : '') + '">' + barre +
             '<div class="contenu"><span class="forme">' + forme(q, i) + '</span>' +
             '<span>' + r + '</span>' + fin + '</div></div>';
    }).join('') + '</div>';
}

function indicesHtml(q, jusqua) {
  return '<div class="indices">' + q.indices.map((t, i) =>
    '<div class="indice' + (i < jusqua ? '' : ' cache') + '">' +
      '<span class="n">INDICE ' + (i + 1) + '</span><span class="txt">' + t + '</span>' +
    '</div>').join('') + '</div>';
}

/* ── Affichage ──────────────────────────────────────────────────────────── */
function dessiner() {
  if (!partie) return;
  const n  = partie.q || 0;
  const q  = quiz.questions[n];
  const js = joueurs();
  const m  = JTCF_QUIZ.manche(idQuiz, q.manche);

  fil.textContent = partie.etat === 'attente' ? ''
    : 'Manche ' + q.manche + (m ? ' · ' + m.titre : '');
  infos.innerHTML = partie.etat === 'attente'
    ? '<span>👥 <b>' + js.length + '</b> connectés</span>'
    : '<span>Q <b>' + (n + 1) + '</b>/' + quiz.questions.length + '</span><span>👥 <b>' + js.length + '</b></span>';

  switch (partie.etat) {

    case 'attente': {
      const lien = lienJoueur();
      scene.innerHTML =
        '<div class="titre">' + quiz.icone + '  ' + quiz.titre + '</div>' +
        '<div class="accueil">' +
          '<div><div class="sous" style="margin-bottom:6px;">Rejoignez la partie</div>' +
          '<div class="code-geant">' + code + '</div></div>' +
          '<div class="qr"><img alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' +
            encodeURIComponent(lien) + '" onerror="this.parentNode.style.display=\'none\'"></div>' +
        '</div>' +
        '<div class="url">' + lien.replace(/^https?:\/\//, '') + '</div>' +
        (js.length
          ? '<div class="joueurs">' + js.map(j =>
              '<span class="pastille" data-id="' + j.id + '">' + j.nom + ' <span style="opacity:.5;">✕</span></span>').join('') + '</div>' +
            '<div class="sous" style="font-size:14px;opacity:.6;">Un participant en trop ? Cliquez sur son prénom.</div>'
          : '<div class="sous">En attente des premiers participants…</div>');
      scene.querySelectorAll('.pastille').forEach(p => {
        p.style.cursor = 'pointer';
        p.addEventListener('click', () => remove(ref(db, chemin() + '/joueurs/' + p.dataset.id)));
      });
      boutons([
        { texte: 'COMMENCER', off: js.length === 0, faire: () => annoncerManche(0) },
        { texte: 'Fermer', sec: true, faire: fermer }
      ]);
      break;
    }

    case 'manche': {
      scene.innerHTML =
        '<div class="manche-mot">MANCHE</div>' +
        '<div class="manche-num">' + q.manche + '</div>' +
        '<div class="titre">' + (m ? m.titre : '') + '</div>' +
        '<div class="sous">' + (m ? m.sous : '') + '</div>';
      boutons([{ texte: 'C\'EST PARTI', faire: () => poserQuestion(n) }]);
      break;
    }

    case 'question': {
      const nb = Object.keys(reponsesDe(n)).length;
      const mystere = q.type === 'mystere';
      scene.innerHTML =
        '<div class="chrono" id="chrono">' + reste + '</div>' +
        (q.titreCourt ? '<div class="regle">' + q.titreCourt + '</div>' : '') +
        '<div class="emoji">' + q.emoji + '</div>' +
        (mystere ? indicesHtml(q, partie.indice || 1) : '') +
        (q.type === 'choix'
          ? '<div class="situation">' + q.enonce + '</div>'
          : '<div class="enonce' + (q.type === 'vf' ? ' citation' : '') + '">' + q.enonce + '</div>') +
        grilleHtml(q, n, 'question') +
        '<div class="compteur">' + nb + ' réponse' + (nb > 1 ? 's' : '') + ' sur ' + js.length + '</div>';
      boutons([
        mystere && (partie.indice || 1) < q.indices.length
          ? { texte: 'INDICE SUIVANT', sec: true,
              faire: () => update(ref(db, chemin()), { indice: (partie.indice || 1) + 1 }) }
          : null,
        { texte: 'VOIR LES RÉPONSES', faire: montrerReponses },
        { texte: 'Arrêter', sec: true, faire: fermer }
      ]);
      if (nb > 0 && nb >= js.length) montrerReponses();
      break;
    }

    case 'reponses':
      scene.innerHTML =
        (q.type === 'choix'
          ? '<div class="situation" style="font-size:21px;">' + q.enonce + '</div>'
          : '<div class="enonce' + (q.type === 'vf' ? ' citation' : '') + '" style="font-size:27px;">' + q.enonce + '</div>') +
        grilleHtml(q, n, 'reponses') +
        (q.debat ? '<div class="debat">💬 ' + q.debat + '</div>' : '') +
        '<div class="sous">Personne n\'a encore la bonne réponse. Écoutez-les d\'abord.</div>';
      boutons([
        { texte: 'RÉVÉLER', faire: reveler },
        { texte: 'Arrêter', sec: true, faire: fermer }
      ]);
      break;

    case 'solution': {
      const dernier = n >= quiz.questions.length - 1;
      scene.innerHTML =
        grilleHtml(q, n, 'solution') +
        '<div class="verdict">' + q.verdict + '</div>' +
        '<div class="explication">' + q.explication + '</div>' +
        (q.regle ? '<div class="regle">' + q.regle + '</div>' : '');
      boutons([
        { texte: 'CLASSEMENT', sec: true, faire: () => update(ref(db, chemin()), { etat: 'classement' }) },
        dernier ? { texte: 'TERMINER', faire: terminer }
                : { texte: 'SUITE', faire: () => suivante(n) }
      ]);
      break;
    }

    case 'classement': {
      const top = js.sort((a, b) => b.score - a.score).slice(0, 8);
      const dernier = n >= quiz.questions.length - 1;
      scene.innerHTML =
        '<div class="titre">🏆 Classement</div>' +
        '<table class="clas">' + top.map((j, i) =>
          '<tr><td class="r">' + (i + 1) + '</td><td>' + j.nom + '</td><td class="p">' + j.score + '</td></tr>').join('') +
        '</table>';
      boutons([
        dernier ? { texte: 'TERMINER', faire: terminer } : { texte: 'SUITE', faire: () => suivante(n) },
        { texte: 'Arrêter', sec: true, faire: fermer }
      ]);
      break;
    }

    case 'finie': {
      const top = js.sort((a, b) => b.score - a.score).slice(0, 5);
      const f = quiz.final;
      scene.innerHTML =
        '<div class="titre">🏆 Et le gagnant est…</div>' +
        '<table class="clas">' + top.map((j, i) =>
          '<tr><td class="r">' + (i + 1) + '</td><td>' + j.nom + '</td><td class="p">' + j.score + '</td></tr>').join('') +
        '</table>' +
        (f ? '<div class="titre" style="font-size:22px;margin-top:10px;">' + f.titre + '</div>' +
             '<div class="huit">' + f.regles.map((r, i) =>
               '<div class="une"><span class="ic">' + r[0] + '</span><div>' +
               '<div class="t">' + (i + 1) + '. ' + r[1] + '</div>' +
               '<div class="d">' + r[2] + '</div></div></div>').join('') + '</div>' +
             '<div class="sous">' + f.mot + '</div>' : '');
      boutons([{ texte: 'FERMER LA PARTIE', faire: fermer }]);
      break;
    }
  }
}

/* ── Pilotage ───────────────────────────────────────────────────────────── */
function annoncerManche(n) {
  update(ref(db, chemin()), { etat: 'manche', q: n, indice: 1 });
}

// Question suivante — avec l'écran d'annonce si on change de manche
function suivante(n) {
  const prochain = n + 1;
  if (quiz.questions[prochain].manche !== quiz.questions[n].manche) annoncerManche(prochain);
  else poserQuestion(prochain);
}

function poserQuestion(n) {
  clearInterval(minuteur);
  const q = quiz.questions[n];
  reste = q.secondes || (q.type === 'choix' ? 45 : q.type === 'mystere' ? 40 : 25);
  update(ref(db, chemin()), { etat: 'question', q: n, indice: 1, depuis: Date.now() });
  minuteur = setInterval(() => {
    reste--;
    const c = document.getElementById('chrono');
    if (c) c.textContent = Math.max(0, reste);
    if (reste <= 0) { clearInterval(minuteur); montrerReponses(); }
  }, 1000);
}

function montrerReponses() {
  clearInterval(minuteur);
  if (partie.etat !== 'question') return;
  update(ref(db, chemin()), { etat: 'reponses' });
}

// Les points ne sont attribués qu'au moment de la révélation.
async function reveler() {
  const n = partie.q || 0;
  const q = quiz.questions[n];
  const rep = reponsesDe(n);
  const justes = Object.keys(rep)
    .filter(id => rep[id].c === q.bonne)
    .sort((a, b) => (rep[a].ms || 0) - (rep[b].ms || 0));

  const maj = {};
  justes.forEach((id, rang) => {
    const bonus = Math.max(0, 50 - rang * 10);
    const avant = (partie.joueurs[id] && partie.joueurs[id].score) || 0;
    maj['joueurs/' + id + '/score'] = avant + 100 + bonus;
  });
  maj['etat'] = 'solution';
  await update(ref(db, chemin()), maj);
}

function terminer() { update(ref(db, chemin()), { etat: 'finie' }); }

async function fermer() {
  clearInterval(minuteur);
  if (code) await remove(ref(db, chemin()));   // rien n'est conservé
  location.reload();
}

window.addEventListener('beforeunload', () => { if (code) remove(ref(db, chemin())); });

choisir();
</script>
</body>
</html>
